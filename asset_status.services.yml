services:
  asset_status.status_change_logger:
    class: Drupal\asset_status\Service\StatusChangeLogger
    arguments:
      - '@entity_type.manager'
      - '@current_user'
      - '@logger.factory'

  asset_status.availability:
    class: Drupal\asset_status\Service\AssetAvailability
    arguments:
      - '@entity_type.manager'

  asset_status.stale_monitor:
    class: Drupal\asset_status\Service\StaleStatusMonitor
    arguments:
      - '@database'
      - '@entity_type.manager'
      - '@config.factory'
      - '@state'
      - '@datetime.time'
      - '@http_client'
      - '@logger.factory'

  asset_status.units:
    class: Drupal\asset_status\Service\UnitManager
    arguments:
      - '@entity_type.manager'
      - '@database'
      - '@asset_status.availability'
